# ============================================================================
# LiteLLM Proxy — Tonic DGX Spark (GB10)
# Phase 1: qwen-main (Qwen3-30B-A3B) only.
# Add qwen-vision and gemma-fast when their models are downloaded.
# ============================================================================

model_list:

  - model_name: qwen-main
    litellm_params:
      model: openai/qwen-main
      api_base: http://vllm-qwen-main:8000/v1
      api_key: "fake-key"
      timeout: 600
      stream_timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_parallel_function_calling: true
      max_tokens: 32768

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 5
  allowed_fails: 2
  cooldown_time: 15
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10
  store_model_in_db: false
  ui_access_mode: admin_only

litellm_settings:
  request_timeout: 600
  set_verbose: false
  drop_params: true
